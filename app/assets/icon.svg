<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- GOAT's app icon: the blue cursor floating in a painted sky above a calm sea.
       Apple's icon grid: an 824 px tile with 100 px margins. scripts/package.js renders it to .icns. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="100" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F86C6"/>
      <stop offset="0.6" stop-color="#93BCE4"/>
      <stop offset="1" stop-color="#D7E7F4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="790" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#43656E"/>
      <stop offset="1" stop-color="#26404A"/>
    </linearGradient>
    <linearGradient id="cloud-a" x1="0" y1="205" x2="0" y2="345" gradientUnits="userSpaceOnUse">
      <stop offset="0.25" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFD2E6"/>
    </linearGradient>
    <linearGradient id="cloud-b" x1="0" y1="560" x2="0" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0.25" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C3D5E8"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="2" x2="0" y2="21.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#1F4FD6"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop offset="0" stop-color="#0B1A26" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B1A26" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <g fill="url(#cloud-a)">
      <circle cx="232" cy="300" r="44"/>
      <circle cx="292" cy="262" r="62"/>
      <circle cx="362" cy="292" r="50"/>
      <rect x="190" y="292" width="216" height="52" rx="26"/>
    </g>
    <g fill="url(#cloud-b)">
      <circle cx="738" cy="610" r="38"/>
      <circle cx="790" cy="584" r="50"/>
      <circle cx="846" cy="612" r="36"/>
      <rect x="704" y="606" width="176" height="52" rx="26"/>
    </g>
    <rect x="100" y="790" width="824" height="134" fill="url(#sea)"/>
    <rect x="100" y="788" width="824" height="4" fill="#E9F1F8" opacity="0.55"/>
    <ellipse cx="520" cy="850" rx="170" ry="22" fill="url(#shadow)"/>

    <!-- The cursor (app/renderer/cursor-art.js's arrow), with a little depth behind it. -->
    <g transform="translate(253 151) scale(28)" stroke-linejoin="round">
      <path d="M3 2 L3 19 L7 15 L10 21.5 L12.8 20.3 L9.9 14 L15.5 14 Z" transform="translate(0.55 0.65)" fill="#14318A" stroke="#14318A" stroke-width="1.25"/>
      <path d="M3 2 L3 19 L7 15 L10 21.5 L12.8 20.3 L9.9 14 L15.5 14 Z" fill="url(#face)" stroke="#FFFFFF" stroke-width="1.25"/>
    </g>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#0B1B33" stroke-opacity="0.14"/>
</svg>
